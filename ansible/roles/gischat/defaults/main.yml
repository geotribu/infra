---
gischat_user: gischat
gischat_user_uid: 1666
gischat_group: gischat
gischat_group_uid: 1666
gischat_shell: /bin/bash

gischat_deploy_dir: /opt/gischat

gischat_docker_image: gounux/gischat

gischat_max_image_size: 800
gischat_max_geojson_features: 200
gischat_max_stored_messages: 5

nginx_ssl_certificate: "/etc/letsencrypt/live/{{ ansible_host }}/fullchain.pem"
nginx_ssl_certificate_key: "/etc/letsencrypt/live/{{ ansible_host }}/privkey.pem"
